<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration</title>
<style>
  :root{--bg:#0e0e10;--card:#1a1a1e;--line:#2a2a30;--txt:#f4f4f5;--mut:#9a9aa3;--acc:#25d366;--red:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  .wrap{max-width:900px;margin:auto;padding:16px 16px 80px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
  h1{font-size:20px} h2{font-size:17px;margin-bottom:10px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:10px;cursor:pointer;font-weight:600}
  .tabs button.on{background:var(--txt);color:#000}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  input,select,textarea{width:100%;background:#111;border:1px solid var(--line);color:var(--txt);padding:11px;border-radius:10px;font-size:15px;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  .btn{background:var(--txt);color:#000;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn.green{background:var(--acc)} .btn.ghost{background:none;color:var(--txt);border:1px solid var(--line)} .btn.red{background:none;color:var(--red);border:1px solid var(--red)}
  .btn:disabled{opacity:.5;cursor:wait}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .list .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .list .it:last-child{border:0}
  .th{width:56px;height:56px;border-radius:10px;background:#26262c;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
  .grow{flex:1;min-width:160px} .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mut{color:var(--mut);font-size:13px}
  .imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .imgs .i{position:relative}
  .imgs img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
  .imgs button{position:absolute;top:-6px;right:-6px;background:var(--red);color:#000;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700}
  .msg{padding:10px;border-radius:10px;margin-bottom:12px;font-size:14px;display:none}
  .msg.ok{display:block;background:#12301f;color:#7dffb0} .msg.ko{display:block;background:#3a1717;color:#ff9a9a}
  .login{max-width:380px;margin:12vh auto}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px} .chk input{width:auto}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- CONNEXION -->
  <div id="loginView" class="login hide">
    <div class="box">
      <h1 style="margin-bottom:6px">Espace administrateur</h1>
      <div class="mut">Connectez-vous pour gérer la boutique.</div>
      <div id="loginMsg" class="msg" style="margin-top:12px"></div>
      <label>Email</label><input id="email" type="email" autocomplete="username">
      <label>Mot de passe</label><input id="password" type="password" autocomplete="current-password">
      <div class="actions"><button class="btn green" style="width:100%" onclick="login()">Se connecter</button></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="appView" class="hide">
    <div class="top">
      <h1>Administration</h1>
      <div style="display:flex;gap:8px">
        <a href="index.html" target="_blank"><button class="btn ghost">Voir la boutique</button></a>
        <button class="btn ghost" onclick="logout()">Déconnexion</button>
      </div>
    </div>
    <div id="msg" class="msg"></div>
    <div class="tabs">
      <button id="tabP" class="on" onclick="tab('p')">Produits</button>
      <button id="tabC" onclick="tab('c')">Catégories</button>
    </div>

    <!-- PRODUITS -->
    <div id="viewP">
      <div class="box">
        <h2 id="pTitle">Ajouter un produit</h2>
        <input type="hidden" id="pId">
        <label>Nom du produit</label><input id="pName" placeholder="Ex : Sneaker Noire Supreme">
        <label>Prix (FCFA)</label><input id="pPrice" type="number" min="0" inputmode="numeric" placeholder="70000">
        <label>Catégorie</label><select id="pCat"></select>
        <label>Tailles disponibles (séparées par des virgules, laisser vide si aucune)</label>
        <input id="pSizes" placeholder="S, M, L, XL  ou  40, 41, 42, 43">
        <label>Couleurs disponibles (séparées par des virgules, laisser vide si aucune)</label>
        <input id="pColors" placeholder="Noir, Blanc, Rouge">
        <label>Stock (quantité disponible, vide = illimité)</label>
        <input id="pStock" type="number" min="0" inputmode="numeric" placeholder="10">
        <label>Description / informations</label><textarea id="pDesc" placeholder="Couleur, matière, état, détails…"></textarea>
        <label>Photos (vous pouvez en choisir plusieurs)</label>
        <input id="pFiles" type="file" accept="image/*" multiple onchange="previewNew()">
        <div class="imgs" id="pImgs"></div>
        <div class="chk"><input id="pActive" type="checkbox" checked><span>Visible dans la boutique</span></div>
        <div class="actions">
          <button class="btn green" id="pSave" onclick="saveProduct()">Enregistrer</button>
          <button class="btn ghost" onclick="resetProduct()">Annuler</button>
        </div>
      </div>
      <div class="box list"><h2>Mes produits <span class="mut" id="pCount"></span></h2><div id="pList"></div></div>
    </div>

    <!-- CATEGORIES -->
    <div id="viewC" class="hide">
      <div class="box">
        <h2 id="cTitle">Ajouter une catégorie</h2>
        <input type="hidden" id="cId">
        <label>Nom</label><input id="cName" placeholder="Ex : Sneakers">
        <label>Emoji (facultatif)</label><input id="cEmoji" placeholder="👟" maxlength="4">
        <label>Ordre d'affichage (0 = en premier)</label><input id="cPos" type="number" value="0">
        <div class="actions">
          <button class="btn green" onclick="saveCategory()">Enregistrer</button>
          <button class="btn ghost" onclick="resetCategory()">Annuler</button>
        </div>
      </div>
      <div class="box list"><h2>Mes catégories</h2><div id="cList"></div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ") + " " + CONFIG.CURRENCY;
const BUCKET = "products";

let categories = [], products = [], keptImages = [];

function flash(text, ok=true){
  const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "ko");
  clearTimeout(flash.t); flash.t = setTimeout(() => m.className = "msg", 4500);
}

/* ---------- Authentification ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? showApp() : showLogin();
}
function showLogin(){ $("loginView").classList.remove("hide"); $("appView").classList.add("hide"); }
async function showApp(){ $("loginView").classList.add("hide"); $("appView").classList.remove("hide"); await refresh(); }
async function login(){
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if(error){ const m=$("loginMsg"); m.textContent="Email ou mot de passe incorrect."; m.className="msg ko"; return; }
  showApp();
}
async function logout(){ await sb.auth.signOut(); showLogin(); }
$("password").addEventListener("keydown", e => { if(e.key==="Enter") login(); });

function tab(t){
  $("viewP").classList.toggle("hide", t!=="p"); $("viewC").classList.toggle("hide", t!=="c");
  $("tabP").classList.toggle("on", t==="p"); $("tabC").classList.toggle("on", t==="c");
}

async function refresh(){
  const [c, p] = await Promise.all([
    sb.from("categories").select("*").order("position").order("name"),
    sb.from("products").select("*").order("created_at", {ascending:false})
  ]);
  if(c.error || p.error){ flash("Erreur de chargement : " + (c.error||p.error).message, false); return; }
  categories = c.data; products = p.data;
  renderCats(); renderProducts();
}

/* ---------- Catégories ---------- */
function renderCats(){
  $("pCat").innerHTML = '<option value="">— Aucune —</option>' + categories.map(c => `<option value="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</option>`).join("");
  $("cList").innerHTML = categories.length ? categories.map(c => `
    <div class="it">
      <div class="th">${esc(c.emoji) || "📁"}</div>
      <div class="grow"><b>${esc(c.name)}</b><span class="mut">Ordre : ${c.position}</span></div>
      <button class="btn ghost" onclick="editCategory('${c.id}')">Modifier</button>
      <button class="btn red" onclick="deleteCategory('${c.id}')">Supprimer</button>
    </div>`).join("") : '<div class="mut">Aucune catégorie pour le moment.</div>';
}
function resetCategory(){ $("cId").value=""; $("cName").value=""; $("cEmoji").value=""; $("cPos").value=0; $("cTitle").textContent="Ajouter une catégorie"; }
function editCategory(id){
  const c = categories.find(x => x.id===id);
  $("cId").value=c.id; $("cName").value=c.name; $("cEmoji").value=c.emoji||""; $("cPos").value=c.position||0;
  $("cTitle").textContent="Modifier la catégorie"; window.scrollTo({top:0,behavior:"smooth"});
}
async function saveCategory(){
  const name = $("cName").value.trim();
  if(!name){ flash("Le nom de la catégorie est obligatoire.", false); return; }
  const row = { name, emoji: $("cEmoji").value.trim(), position: parseInt($("cPos").value)||0 };
  const id = $("cId").value;
  const { error } = id ? await sb.from("categories").update(row).eq("id", id) : await sb.from("categories").insert(row);
  if(error){ flash("Erreur : " + error.message, false); return; }
  flash("Catégorie enregistrée ✔"); resetCategory(); refresh();
}
async function deleteCategory(id){
  if(!confirm("Supprimer cette catégorie ? Les produits resteront, mais sans catégorie.")) return;
  const { error } = await sb.from("categories").delete().eq("id", id);
  if(error){ flash("Erreur : " + error.message, false); return; }
  flash("Catégorie supprimée"); refresh();
}

/* ---------- Produits ---------- */
function renderProducts(){
  $("pCount").textContent = "(" + products.length + ")";
  $("pList").innerHTML = products.length ? products.map(p => {
    const c = categories.find(c => c.id===p.category_id);
    const th = p.images?.[0] ? `<img class="th" src="${esc(p.images[0])}" alt="">` : `<div class="th">🛍️</div>`;
    const stockTxt = p.stock==null ? "Stock illimité" : (p.stock===0 ? "ÉPUISÉ" : "Stock : "+p.stock);
    return `<div class="it">${th}
      <div class="grow"><b>${esc(p.name)}</b><span class="mut">${fmt(p.price)} · ${esc(c?.name || "Sans catégorie")} · ${stockTxt}${p.active ? "" : " · masqué"}</span></div>
      ${p.stock==null ? "" : `<button class="btn ghost" onclick="adjustStock('${p.id}',-1)">−1</button><button class="btn ghost" onclick="adjustStock('${p.id}',1)">+1</button>`}
      <button class="btn ghost" onclick="editProduct('${p.id}')">Modifier</button>
      <button class="btn red" onclick="deleteProduct('${p.id}')">Supprimer</button>
    </div>`; }).join("") : '<div class="mut">Aucun produit. Ajoutez le premier ci-dessus.</div>';
}
function drawImgs(){
  const files = [...$("pFiles").files];
  $("pImgs").innerHTML =
    keptImages.map((u,i) => `<div class="i"><img src="${esc(u)}" alt=""><button title="Retirer" onclick="removeKept(${i})">×</button></div>`).join("") +
    files.map(f => `<div class="i"><img src="${URL.createObjectURL(f)}" alt=""></div>`).join("");
}
function removeKept(i){ keptImages.splice(i,1); drawImgs(); }
function previewNew(){ drawImgs(); }
function resetProduct(){
  $("pColors").value=""; $("pStock").value="";
  $("pId").value=""; $("pName").value=""; $("pPrice").value=""; $("pCat").value=""; $("pSizes").value=""; $("pDesc").value="";
  $("pFiles").value=""; $("pActive").checked=true; keptImages=[]; drawImgs(); $("pTitle").textContent="Ajouter un produit";
}
function editProduct(id){
  const p = products.find(x => x.id===id);
  $("pColors").value=(p.colors||[]).join(", "); $("pStock").value=p.stock ?? "";
  $("pId").value=p.id; $("pName").value=p.name; $("pPrice").value=p.price; $("pCat").value=p.category_id||"";
  $("pSizes").value=(p.sizes||[]).join(", "); $("pDesc").value=p.description||""; $("pActive").checked=p.active;
  $("pFiles").value=""; keptImages=[...(p.images||[])]; drawImgs();
  $("pTitle").textContent="Modifier le produit"; tab("p"); window.scrollTo({top:0,behavior:"smooth"});
}

async function shrink(file, max=1100){
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width*r); c.height = Math.round(bmp.height*r);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
}
async function uploadImages(files){
  const urls = [];
  for(const f of files){
    const blob = await shrink(f);
    const path = crypto.randomUUID() + ".jpg";
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:"image/jpeg" });
    if(error) throw error;
    urls.push(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
  }
  return urls;
}
function pathFromUrl(u){ const i = u.indexOf("/" + BUCKET + "/"); return i<0 ? null : decodeURIComponent(u.slice(i + BUCKET.length + 2).split("?")[0]); }

async function saveProduct(){
  const name = $("pName").value.trim(), price = parseInt($("pPrice").value);
  if(!name){ flash("Le nom est obligatoire.", false); return; }
  if(isNaN(price) || price < 0){ flash("Indiquez un prix valide.", false); return; }
  const btn = $("pSave"); btn.disabled = true; btn.textContent = "Enregistrement…";
  try{
    const newUrls = await uploadImages([...$("pFiles").files]);
    const row = {
      name, price,
      category_id: $("pCat").value || null,
      sizes: $("pSizes").value.split(",").map(s => s.trim()).filter(Boolean),
      colors: $("pColors").value.split(",").map(s => s.trim()).filter(Boolean),
      stock: $("pStock").value==="" ? null : Math.max(0, parseInt($("pStock").value)||0),
      description: $("pDesc").value.trim(),
      images: [...keptImages, ...newUrls],
      active: $("pActive").checked
    };
    const id = $("pId").value;
    const { error } = id ? await sb.from("products").update(row).eq("id", id) : await sb.from("products").insert(row);
    if(error) throw error;
    // supprimer du stockage les photos retirées lors d'une modification
    if(id){
      const old = products.find(p => p.id===id)?.images || [];
      const gone = old.filter(u => !row.images.includes(u)).map(pathFromUrl).filter(Boolean);
      if(gone.length) await sb.storage.from(BUCKET).remove(gone);
    }
    flash("Produit enregistré ✔"); resetProduct(); refresh();
  }catch(e){ flash("Erreur : " + (e.message || e), false); }
  btn.disabled = false; btn.textContent = "Enregistrer";
}
async function deleteProduct(id){
  if(!confirm("Supprimer ce produit définitivement ?")) return;
  const p = products.find(x => x.id===id);
  const { error } = await sb.from("products").delete().eq("id", id);
  if(error){ flash("Erreur : " + error.message, false); return; }
  const paths = (p.images||[]).map(pathFromUrl).filter(Boolean);
  if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  flash("Produit supprimé"); refresh();
}
async function adjustStock(id, d){
  const p = products.find(x => x.id===id);
  const n = Math.max(0, (p.stock||0) + d);
  const { error } = await sb.from("products").update({ stock: n }).eq("id", id);
  if(error){ flash("Erreur : " + error.message, false); return; }
  refresh();
}

init();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — Talla Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    form {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
    }
    button { cursor: pointer; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Talla Shop</h1>
  <form id="resetForm">
    <h2>Récupération du compte</h2>

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email"
           value="sambamoussadiouf@gmail.com"
           autocomplete="email" required>

    <button id="sendButton" type="button">
      Envoyer le lien de récupération
    </button>

    <hr>

    <div id="passwordSection" hidden>
      <label for="password">Nouveau mot de passe</label>
      <input id="password" type="password"
             minlength="8" autocomplete="new-password"
             placeholder="8 caractères minimum" required>

      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input id="confirmPassword" type="password"
             minlength="8" autocomplete="new-password" required>

      <button type="submit">Enregistrer le nouveau mot de passe</button>
    </div>

    <p id="message" role="status"></p>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const sb = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    const message = document.getElementById("message");
    const passwordSection = document.getElementById("passwordSection");
    const sendButton = document.getElementById("sendButton");
    const form = document.getElementById("resetForm");

    function showMessage(text) {
      message.textContent = text;
    }

    // Envoyer l'e-mail de récupération
    sendButton.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Saisis ton adresse e-mail.");
        return;
      }

      sendButton.disabled = true;
      showMessage("Envoi en cours...");

      try {
        const redirectTo =
          window.location.origin + window.location.pathname;

        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo
        });

        if (error) throw error;

        showMessage(
          "Demande envoyée. Vérifie ta boîte Gmail et tes courriers indésirables."
        );
      } catch (error) {
        showMessage("Erreur : " + error.message);
      } finally {
        sendButton.disabled = false;
      }
    });

    // Supabase signale que l'utilisateur revient du lien de récupération
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        passwordSection.hidden = false;
        sendButton.hidden = true;
        showMessage("Choisis maintenant ton nouveau mot de passe.");
      }
    });

    // Enregistrer le nouveau mot de passe
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Le mot de passe doit contenir au moins 8 caractères.");
        return;
      }

      if (password !== confirmation) {
        showMessage("Les deux mots de passe ne correspondent pas.");
        return;
      }

      const submitButton = form.querySelector(
        'button[type="submit"]'
      );
      submitButton.disabled = true;
      showMessage("Enregistrement en cours...");

      try {
        const { error } = await sb.auth.updateUser({ password });

        if (error) throw error;

        showMessage(
          "Mot de passe modifié avec succès. Tu peux maintenant te connecter à l'administration."
        );

        passwordSection.hidden = true;
      } catch (error) {
        showMessage("Erreur : " + error.message);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
